  
<form [formGroup]="newTradeForm" (ngSubmit)="onSubmit()" class="mt-40 max-w-sm mx-auto">
  
  <div class="mb-5">
    <label for="date" class="block mb-2.5 text-sm font-medium text-heading">Date</label>
    <input 
      type="date" 
      id="date" 
      formControlName="date" 
      class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2.5 shadow-xs placeholder:text-body" 
      required 
    />
  </div>

 
  <div class="mb-5">
    <label for="pnl" class="block mb-2.5 text-sm font-medium text-heading">PnL</label>
    <input 
      type="number" 
      id="pnl" 
      formControlName="pnl" 
      class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2.5 shadow-xs placeholder:text-body" 
      placeholder="0.00" 
      required 
    />
  </div>


  <div class="mb-5">
    <label for="urlImage" class="block mb-2.5 text-sm font-medium text-heading">Image URL</label>
    <input 
      type="text" 
      id="urlImage" 
      formControlName="urlImage" 
      class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2.5 shadow-xs placeholder:text-body" 
      placeholder="https://ejemplo.com/imagen.png" 
      required 
    />
  </div>

  
  <div class="mb-5">
    <label for="result" class="block mb-2.5 text-sm font-medium text-heading">Result</label>
    <select 
      id="result" 
      formControlName="result" 
      class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2.5 shadow-xs">
      
      
      <option value="" disabled selected>-- Select a result --</option>

      
      @for (item of tradeOutcome; track item.result) {
        <option [value]="item.result">{{ item.result }}</option>
      }
    </select>
  </div>


 <button 
    type="submit" 
    [disabled]="newTradeForm.invalid"
    class="w-full text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center disabled:opacity-50 disabled:cursor-not-allowed">
    Save Trade
  </button>
</form>
